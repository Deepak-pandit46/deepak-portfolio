<svg width="800" height="460" viewBox="0 0 800 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f192e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="460" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="799" height="459" rx="13.5" stroke="rgba(56, 189, 248, 0.2)"/>

  <!-- Browser Chrome Top Bar -->
  <path d="M0 14C0 6.26801 6.26801 0 14 0H786C793.732 0 800 6.26801 800 14V44H0V14Z" fill="#0b1222"/>
  <circle cx="28" cy="22" r="5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="44" cy="22" r="5" fill="#f59e0b" fill-opacity="0.8"/>
  <circle cx="60" cy="22" r="5" fill="#10b981" fill-opacity="0.8"/>
  
  <!-- Browser Address Pill -->
  <rect x="180" y="10" width="440" height="24" rx="6" fill="#111c33"/>
  <text x="400" y="26" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="11" text-anchor="middle">https://tastemate-app.demo</text>

  <!-- TasteMate App Header -->
  <rect x="40" y="66" width="720" height="54" rx="10" fill="url(#cardBg)" stroke="rgba(56, 189, 248, 0.15)"/>
  <text x="65" y="99" fill="#00f2fe" font-family="-apple-system, system-ui, sans-serif" font-weight="bold" font-size="18">TasteMate</text>
  <text x="160" y="98" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="12">Food Ordering • Table Reservations • Hotel Stays</text>
  
  <!-- AI Agent Status Indicator -->
  <rect x="610" y="78" width="132" height="30" rx="15" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)"/>
  <circle cx="626" cy="93" r="4" fill="#00f2fe"/>
  <text x="638" y="97" fill="#f8fafc" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="11">AI Agent Active</text>

  <!-- AI Discovery Search Bar -->
  <rect x="40" y="136" width="720" height="46" rx="8" fill="#0c1529" stroke="rgba(56, 189, 248, 0.25)"/>
  <text x="65" y="164" fill="#38bdf8" font-family="-apple-system, system-ui, sans-serif" font-size="14">✨</text>
  <text x="90" y="164" fill="#e2e8f0" font-family="-apple-system, system-ui, sans-serif" font-size="13">"Find top-rated Italian restaurant with table for 2 & budget hotel nearby..."</text>
  <rect x="650" y="143" width="96" height="32" rx="6" fill="url(#cyanGrad)"/>
  <text x="698" y="163" fill="#040711" font-family="-apple-system, system-ui, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Ask AI</text>

  <!-- Grid of 2 Cards: Restaurant & Hotel -->
  <!-- Card 1: Restaurant Discovery -->
  <rect x="40" y="200" width="345" height="225" rx="10" fill="url(#cardBg)" stroke="rgba(56, 189, 248, 0.15)"/>
  <rect x="55" y="215" width="315" height="95" rx="6" fill="#14213d"/>
  <text x="70" y="260" fill="#38bdf8" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="bold">🍽️ Grand Gourmet Bistro</text>
  <text x="70" y="280" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="11">Dine-in • Food Delivery • Table Reservation</text>
  
  <rect x="310" y="225" width="50" height="20" rx="4" fill="#059669"/>
  <text x="335" y="239" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">★ 4.8</text>

  <text x="55" y="335" fill="#f8fafc" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600">Popular Delicacies Available</text>
  <text x="55" y="355" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="11">Fast dispatch via backend API • Real-time slot status</text>
  
  <rect x="55" y="375" width="145" height="34" rx="6" fill="#192849" stroke="rgba(56, 189, 248, 0.3)"/>
  <text x="127" y="396" fill="#38bdf8" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Order Food Online</text>
  
  <rect x="210" y="375" width="160" height="34" rx="6" fill="url(#cyanGrad)"/>
  <text x="290" y="396" fill="#040711" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Reserve a Table</text>

  <!-- Card 2: Hotel Booking -->
  <rect x="415" y="200" width="345" height="225" rx="10" fill="url(#cardBg)" stroke="rgba(56, 189, 248, 0.15)"/>
  <rect x="430" y="215" width="315" height="95" rx="6" fill="#14213d"/>
  <text x="445" y="260" fill="#38bdf8" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="bold">🏨 Royal Skyline Suites</text>
  <text x="445" y="280" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="11">Deluxe Rooms • City View • Instant Check-in</text>
  
  <rect x="685" y="225" width="50" height="20" rx="4" fill="#059669"/>
  <text x="710" y="239" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">★ 4.9</text>

  <text x="430" y="335" fill="#f8fafc" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600">Room Booking & Dates</text>
  <text x="430" y="355" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="11">MongoDB synchronized booking records & REST APIs</text>
  
  <rect x="430" y="375" width="145" height="34" rx="6" fill="#192849" stroke="rgba(56, 189, 248, 0.3)"/>
  <text x="502" y="396" fill="#38bdf8" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Check Availability</text>
  
  <rect x="585" y="375" width="160" height="34" rx="6" fill="url(#cyanGrad)"/>
  <text x="665" y="396" fill="#040711" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Book Room Now</text>
</svg>

